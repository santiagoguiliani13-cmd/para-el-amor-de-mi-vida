<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi futura esposa Valeria 💘</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --pink: #ff4d6d; }
        body {
            margin: 0; padding: 0; font-family: 'Quicksand', sans-serif;
            background: url('static/images/fondo.jpg') no-repeat center center fixed; 
            background-size: cover; color: #333; overflow-x: hidden; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        /* Fotos Polaroid estáticas en las esquinas */
        .floating-photo {
            position: absolute; width: 110px; height: auto; border: 6px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); z-index: 1; transition: transform 0.3s;
        }
        .p1 { top: 5%; left: 5%; transform: rotate(-15deg); }
        .p2 { top: 10%; right: 5%; transform: rotate(10deg); }
        .p3 { bottom: 5%; left: 10%; transform: rotate(5deg); }
        .p4 { bottom: 10%; right: 5%; transform: rotate(-20deg); }

        /* Pingüinos y corazones que flotan hacia arriba */
        .floater {
            position: fixed; bottom: -150px; z-index: 2; opacity: 0.8;
            pointer-events: none; animation: floatAnimation linear infinite;
        }
        @keyframes floatAnimation {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: translateY(-120vh) translateX(-20px) rotate(-10deg); opacity: 0; }
        }

        /* Contenedor principal */
        .container {
            position: relative; z-index: 5; width: 90%; max-width: 400px; text-align: center;
            padding: 30px 20px; background: rgba(255, 255, 255, 0.94); border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 77, 109, 0.3); backdrop-filter: blur(5px);
        }

        .step { display: none; animation: fadeIn 0.8s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        h1 { font-family: 'Dancing Script', cursive; color: var(--pink); font-size: 2.2rem; }
        .btn {
            background-color: var(--pink); color: white; border: none; padding: 12px 25px;
            border-radius: 50px; font-size: 1rem; font-weight: 600; cursor: pointer;
            margin-top: 20px; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.3);
        }
        #btn-no { background-color: #555; position: absolute; }

        @media (max-width: 768px) {
            .floating-photo { width: 80px; }
            .p3, .p4 { display: none; }
        }
    </style>
</head>
<body onload="iniciarElementos()">

    <audio id="musicaFondo" loop>
        <source src="static/images/musica.mp3" type="audio/mpeg">
    </audio>

    <img src="static/images/foto1.jpg" class="floating-photo p1">
    <img src="static/images/foto2.jpg" class="floating-photo p2">
    <img src="static/images/foto3.jpg" class="floating-photo p3">
    <img src="static/images/foto4.jpg" class="floating-photo p4">

    <div class="container">
        <div id="step1" class="step active">
            <h1>Hola...</h1>
            <p>Ya es momento de dar el siguiente paso mi princesa, quiero que seas tú.</p>
            <button class="btn" onclick="nextStep(2)">Continuar</button>
        </div>

        <div id="step2" class="step">
            <h1>Un nuevo comienzo</h1>
            <p>Se que esta vez será diferente, se que esta vez lo lograremos.</p>
            <button class="btn" onclick="nextStep(3)">Tengo una pregunta...</button>
        </div>

        <div id="step3" class="step">
            <h1>¿Quieres ser mi novia?</h1>
            <p>Quiero que nos demos otra oportunidad porque en mi futuro estas tu, hare lo posible porque eso se cumpla.</p>
            <div style="height: 150px; position: relative; margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
                <button id="btn-si" class="btn" onclick="celebrar()">¡SÍ! ❤️</button>
                <button id="btn-no" class="btn" onmouseover="moverBoton(this)" onclick="moverBoton(this)">No</button>
            </div>
        </div>
    </div>

    <script>
        // Iniciar los pingüinos y corazones al cargar la página
        function iniciarElementos() {
            const imagenes = ['pinguino.png', 'corazon.png'];
            for(let i=0; i<8; i++) {
                let img = document.createElement('img');
                img.src = 'static/images/' + imagenes[i % 2];
                img.className = 'floater';
                img.style.left = (Math.random() * 90) + '%';
                img.style.width = (Math.random() * 30 + 40) + 'px';
                img.style.animationDuration = (Math.random() * 10 + 12) + 's';
                img.style.animationDelay = (Math.random() * 8) + 's';
                document.body.appendChild(img);
            }
        }

        function nextStep(step) {
            // Iniciar música suave en el primer botón
            if (step === 2) {
                const musica = document.getElementById('musicaFondo');
                musica.volume = 0.3; // Volumen al 20%
                musica.play();
            }
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        function moverBoton(btn) {
            btn.style.position = "fixed";
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 40) + 20;
            btn.style.left = x + "px";
            btn.style.top = y + "px";
        }

        function celebrar() {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.querySelector('#step3 h1').innerText = "Esta vez cumpliremos todo lo que nos hemos prometido mi niña, te amo con mi vida.";
            document.getElementById('btn-no').style.display = 'none';
            // Redirigir a la carta después de 3 segundos
            setTimeout(() => {
                window.location.href = "carta.html";
            }, 3000);
        }
    </script>
</body>

</html>
